[profile.default]
src = "contracts"
test = "forge-test"
script = "forge-script"
out = "forge-out"
cache_path = "forge-cache"
libs = ["node_modules", "lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
revert_strings = "strip"
auto_detect_solc = false
fs_permissions = [{ access = "read", path = "./" }]

[invariant]
runs = 16
depth = 200
fail_on_revert = true

# El alta acierta cerca del 1,5 % de las llamadas. Con 256 corridas,
# depth 800 deja (0,985)^800 casi en cero: ninguna corrida se queda sin esa accion.
[profile.ci.invariant]
runs = 256
depth = 800
fail_on_revert = true

[lint]
lint_on_build = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "preserve"
